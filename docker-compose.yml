services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_rental
      POSTGRES_USER: smart_rental
      POSTGRES_PASSWORD: smart_rental
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://smart_rental:smart_rental@db:5432/smart_rental
      CORS_ORIGINS: http://localhost:5199,http://127.0.0.1:5199
    ports:
      - "8001:8001"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      PORT: 5199
      VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "5199:5199"
    depends_on:
      - backend

volumes:
  postgres_data:
